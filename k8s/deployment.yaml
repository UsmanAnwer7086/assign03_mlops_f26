apiVersion: apps/v1
kind: Deployment
metadata:
  name: btc-forecast
  labels:
    app: btc-forecast
spec:
  replicas: 3
  selector:
    matchLabels:
      app: btc-forecast
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: btc-forecast
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: YOUR_DOCKERHUB_USER/btc-forecast:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: btc-forecast-config
            - secretRef:
                name: btc-forecast-secret
          volumeMounts:
            - name: models
              mountPath: /app/models
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: btc-models-pvc
