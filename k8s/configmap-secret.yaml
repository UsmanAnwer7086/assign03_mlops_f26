apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-forecast-config
data:
  MODEL_STAGE: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
  MODEL_DIR: "/app/models"
  DATA_DIR: "/app/models/data"
---
apiVersion: v1
kind: Secret
metadata:
  name: btc-forecast-secret
type: Opaque
# Demo values only - never commit real credentials. Create real ones with:
#   kubectl create secret generic btc-forecast-secret --from-literal=RELOAD_TOKEN=... --from-literal=API_KEY=...
stringData:
  RELOAD_TOKEN: "change-me"
  API_KEY: "demo-api-key"
