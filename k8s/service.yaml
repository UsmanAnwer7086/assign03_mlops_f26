apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-svc
spec:
  type: ClusterIP
  selector:
    app: btc-forecast
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-nodeport
spec:
  type: NodePort
  selector:
    app: btc-forecast
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
