# PIPELINE DEFINITION
# Name: btc-forecast-pipeline
# Description: Daily BTC-USD 7-day forecast training
components:
  comp-build-features:
    executorLabel: exec-build-features
    inputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        features:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-ingest-data:
    executorLabel: exec-ingest-data
    outputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        features:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-build-features:
      container:
        args:
        - --inp
        - '{{$.inputs.artifacts[''raw_data''].path}}'
        - --out
        - '{{$.outputs.artifacts[''features''].path}}'
        command:
        - python
        - -m
        - src.preprocess
        image: uanwer7/btc-forecast:latest
    exec-ingest-data:
      container:
        args:
        - --out
        - '{{$.outputs.artifacts[''raw_data''].path}}'
        command:
        - python
        - -m
        - src.etl_fetch
        image: uanwer7/btc-forecast:latest
    exec-train-model:
      container:
        args:
        - --data
        - '{{$.inputs.artifacts[''features''].path}}'
        - --model-dir
        - '{{$.outputs.artifacts[''model''].path}}'
        command:
        - python
        - -m
        - src.train_forecast
        image: uanwer7/btc-forecast:latest
pipelineInfo:
  description: Daily BTC-USD 7-day forecast training
  name: btc-forecast-pipeline
root:
  dag:
    tasks:
      build-features:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-build-features
        dependentTasks:
        - ingest-data
        inputs:
          artifacts:
            raw_data:
              taskOutputArtifact:
                outputArtifactKey: raw_data
                producerTask: ingest-data
        taskInfo:
          name: build-features
      ingest-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-ingest-data
        taskInfo:
          name: ingest-data
      train-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model
        dependentTasks:
        - build-features
        inputs:
          artifacts:
            features:
              taskOutputArtifact:
                outputArtifactKey: features
                producerTask: build-features
        taskInfo:
          name: train-model
schemaVersion: 2.1.0
sdkVersion: kfp-2.8.0
